name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node --check server/index.js
      - run: node --check server/proxmox.js
      - run: node --check server/security.js
      - run: node --test test/*.test.js
      - run: npm run build
